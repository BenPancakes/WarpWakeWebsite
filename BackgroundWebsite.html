<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>The Priests Sketch Room</title>
    <style>
        html, body 
        {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
        }

        .background-container 
        {
            padding: 40px 0;
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-image 
        {
            background-image: url('Art/Website Background.png');
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .hotspot 
        {
            background-color: rgba(255, 0, 0, 0.4);
            position: absolute;
            cursor: pointer;
        }

        .bookshelf 
        {
            top: 40%;
            left: 30%;
            width: 5%;
            height: 7%;
        }

        .clock 
        {
            top: 6%;
            left: 55%;
            width: 10%;
            height: 20%;
            border-radius: 50%;
            transform: translate(-45%, 0);
        }

        .birdcage 
        {
            top: 40%;
            left: 70%;
            width: 5%;
            height: 7%;
        }

        .tv 
        {
            top: 67%;
            left: 67%;
            width: 6%;
            height: 13%;
        }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="background-image">
            <a href="https://github.com/BenPancakes/WarpWakeWebsite" class="hotspot bookshelf"></a>
            <a href="https://example.com/clock" class="hotspot clock"></a>
            <a href="https://twitter.com" class="hotspot birdcage"></a>
            <a href="https://www.youtube.com/@RedVeilGames" class="hotspot tv"></a>
        </div>
    </div>
</body>
</html>
