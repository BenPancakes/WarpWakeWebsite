<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>The Priests Sketch Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html, body 
        {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
        }

        .background-container 
        {
            padding: 40px 0;
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-image 
        {
            background-image: url('Art/Website Background.png');
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .hotspot 
        {
            background-color: rgba(255, 0, 0, 0.4);
            position: absolute;
            cursor: pointer;
        }

        .bookshelf 
        {
            top: 2%;
            left: 12%;
            width: 21%;
            height: 90%;
        }

        .clock 
        {
            top: 6%;
            left: 55%;
            width: 10%;
            height: 20%;
            border-radius: 50%;
            transform: translate(-45%, 0);
        }

        .birdcage 
        {
            top: 40%;
            left: 70%;
            width: 5%;
            height: 7%;
        }

        .tv 
        {
            top: 67%;
            left: 67%;
            width: 6%;
            height: 13%;
        }

        .text-box 
        {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background-color: beige;
            color: #000;
            font-size: 12px;
            display: none;
            border-top: 3px solid #444;
            z-index: 1000;
            font-family: 'Press Start 2P', monospace;
        }

        .birdcage:hover ~ .birdcage-thoughts
        {
            display: block;
        }

        .tv:hover ~ .tv-thoughts 
        {
            display: block;
        }

        .bookshelf:hover ~ .bookshelf-thoughts 
        {
            display: block;
        }

        .clock:hover ~ .clock-thoughts 
        {
            display: block;
        }

    </style>
</head>
<body>
    <div class="background-container">
        <div class="background-image">
            <a href="https://benpancakes.github.io/WarpWakeWebsite/" class="hotspot bookshelf"></a>
            <a href="https://example.com/clock" class="hotspot clock"></a>
            <a href="https://twitter.com" class="hotspot birdcage"></a>
            <a href="https://www.youtube.com/@RedVeilGames" class="hotspot tv"></a>

            <div class="text-box birdcage-thoughts">
                I never had to feed this beast. I wonder how much the veil has affected its lineage.
            </div>

            <div class="text-box tv-thoughts">
                This box only hums when the room gets cold. I think it's waiting for someone.
            </div>

            <div class="text-box bookshelf-thoughts">
                My notes of my experiments. I dont know why they change color and size. 
            </div>

            <div class="text-box clock-thoughts">
                It always is ticking but its hands never move.
            </div>
        </div>
    </div>
</body>
</html>
